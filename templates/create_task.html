{% extends 'base.html' %}

{% block title %}
Study Tracker - Create Task
{% endblock %}

{% block content %}
    <h1>Create a new task</h1>
    <a href="{{ url_for('home_page')}}"> Return Home </a>
    <br>
    <form method="post">
        <h2>Task Title</h2>
        <input type="text" 
               name="title"
               placeholder="Task title goes here!",
               value="{{ request.form['title'] }}"/>
        <br>
        <p>Max 50 Characters</p>

        <h2>Subject</h2>
        <input type="text"
               name="subject"
               placeholder="Subject goes here!"
               value="{{ request.form['subject'] }}"/>
        <br>

        <h2>Description</h2>
        <textarea name="desc"
                  placeholder="Describe this task if you want to!"
                  rows="25"
                  cols="75"
                  > {{ request.form['description'] }}</textarea>
        <br>

        <button type="submit">Create Task!</button>
    </form>

{% endblock %}
